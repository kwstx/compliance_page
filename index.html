<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farce - Say it once, watch AI agents do it forever</title>
    <meta name="description" content="Automate sales, meetings, operations, support, and admin tasks without writing a line of code.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>
    <div class="page-container">
        
        <nav class="navbar">
            <div class="nav-left">
                <span class="logo-icon">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </span>
                <span class="logo-text">farce</span>
            </div>
            <div class="nav-links">
                <a href="#">Customers</a>
                <a href="#" class="dropdown">
                    Use Cases 
                    <svg width="8" height="5" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg" class="caret">
                        <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
                <a href="#">Pricing</a>
            </div>
            <div class="nav-actions">
                <button class="btn-login">Log in</button>
                <button class="btn-primary">Try for free</button>
            </div>
        </nav>

        <section class="hero-section">
            <img src="assets/hero_image.jpg" alt="Hero Landscape - AI Agents" class="hero-image">
        </section>

        <main class="content-section">
            <div class="content-left">
                <h1 class="headline">
                    Say it once, watch AI<br>
                    agents do it <span class="highlight">forever</span>
                </h1>
                
                <div class="logo-cloud">
                    <p class="logo-cloud-title">Used at global enterprises such as</p>
                    <div class="logos">
                        <!-- Mock SVGs/text for logos -->
                        <span class="brand-logo monzo">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 3px; vertical-align: middle;">
                                <path d="M4 12V20H8V14L12 18L16 14V20H20V12L12 4L4 12Z" fill="black"/>
                            </svg>
                            monzo
                        </span>
                        <span class="brand-logo guild">Guild</span>
                        <span class="brand-logo cleo">
                            <span class="cleo-box">CLEO</span>
                        </span>
                        <span class="brand-logo trademe">
                            trademe<span class="tm-icon">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="black" xmlns="http://www.w3.org/2000/svg" style="vertical-align: middle; margin-left: 2px;">
                                    <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" fill="black"/>
                                    <path d="M12 16L15.4641 10H8.5359L12 16Z" fill="white"/>
                                </svg>
                            </span>
                        </span>
                        <span class="brand-logo paradigm">
                            <span class="paradigm-icon">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align: middle; margin-right: 5px;">
                                    <rect x="4" y="4" width="16" height="16" rx="2" stroke="black" stroke-width="3"/>
                                </svg>
                            </span>
                            Paradigm
                        </span>
                    </div>
                </div>
            </div>
            
            <div class="content-right">
                <p class="description">
                    Automate sales, meetings, operations, support, and admin tasks without writing a line of code.
                </p>
                <div class="email-form">
                    <input type="email" placeholder="Enter your email" class="email-input">
                    <button class="btn-primary form-btn">Try for free</button>
                </div>
            </div>
        </main>

    </div>
</body>
</html>
